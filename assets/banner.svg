<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#374151" opacity="0.8" />
    </pattern>

    <!-- Flow Filters and Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      .node-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: dash 12s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 6, 6;
        animation: dash-rev 15s linear infinite;
      }
      .float-orb1 {
        animation: float1 10s ease-in-out infinite alternate;
      }
      .float-orb2 {
        animation: float2 12s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -160; }
      }
      @keyframes dash-rev {
        to { stroke-dashoffset: 160; }
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.75; transform: scale(1.02); }
      }
      @keyframes float1 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(40px, -25px); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-35px, 30px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Orbs in Background -->
  <g class="float-orb1" opacity="0.35">
    <circle cx="200" cy="100" r="120" fill="#6366f1" filter="url(#softGlow)" />
  </g>
  <g class="float-orb2" opacity="0.25">
    <circle cx="1000" cy="300" r="140" fill="#ec4899" filter="url(#softGlow)" />
  </g>
  <g class="float-orb1" opacity="0.2">
    <circle cx="650" cy="350" r="100" fill="#06b6d4" filter="url(#softGlow)" />
  </g>

  <!-- Dynamic Process / Workflow Architecture Graphic Layer (Background/Midground) -->
  <g opacity="0.55">
    <!-- Flow Connector Lines -->
    <path class="dash-flow" d="M 120 320 C 300 320, 350 360, 500 360 C 700 360, 800 320, 1080 320" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="dash-flow-rev" d="M 150 80 C 400 80, 500 40, 750 40 C 950 40, 1020 80, 1100 80" fill="none" stroke="#06b6d4" stroke-width="2" />
    
    <!-- Top & Bottom BPMN Gateway / Node Shapes -->
    <g transform="translate(180, 70) rotate(45)">
      <rect width="20" height="20" fill="#0b0f19" stroke="#06b6d4" stroke-width="2" rx="2" />
    </g>
    <g transform="translate(740, 30) rotate(45)">
      <rect width="20" height="20" fill="#0b0f19" stroke="#8b5cf6" stroke-width="2" rx="2" />
    </g>
    <g transform="translate(490, 350) rotate(45)">
      <rect width="20" height="20" fill="#0b0f19" stroke="#ec4899" stroke-width="2" rx="2" />
    </g>
    <g transform="translate(860, 310) rotate(45)">
      <rect width="20" height="20" fill="#0b0f19" stroke="#3b82f6" stroke-width="2" rx="2" />
    </g>
    
    <!-- Micro Process Step Blocks -->
    <rect x="320" y="70" width="70" height="20" rx="4" fill="#1f2937" stroke="#6366f1" stroke-width="1.2" />
    <text x="355" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">TRIGGER</text>
    
    <rect x="880" y="70" width="70" height="20" rx="4" fill="#1f2937" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="915" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle">EXECUTE</text>

    <rect x="240" y="310" width="80" height="22" rx="4" fill="#1f2937" stroke="#3b82f6" stroke-width="1.2" />
    <text x="280" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">VALIDATE</text>

    <rect x="650" y="350" width="80" height="22" rx="4" fill="#1f2937" stroke="#ec4899" stroke-width="1.2" />
    <text x="690" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbcfe8" text-anchor="middle">ORCHESTRATE</text>
  </g>

  <!-- High-Contrast Foreground Content Area -->
  <g id="foreground-content">
    <!-- Tag Pill -->
    <g transform="translate(600, 108)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="-168" cy="0" r="5" fill="#10b981" />
      <text x="-152" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" letter-spacing="1.5">ENTERPRISE WORKFLOW &amp; BPM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Business Process
    </text>
    <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
      &amp; Workflow Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9ca3af" text-anchor="middle">
      Curated BPMN Engines • Low-Code Process Builders • Approval Automation • Orchestration Platforms
    </text>

    <!-- Core Badges / Highlights in Hero -->
    <g transform="translate(600, 315)">
      <!-- Item 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ BPMN 2.0 / DMN</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">🌐 Cloud &amp; SaaS</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">🔓 Open-Source</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(240, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">🤖 AI Orchestration</text>
      </g>
    </g>
  </g>
</svg>
